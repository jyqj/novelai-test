name: Novel workflow tests

on:
  push:
    branches: [main, feat/novel-integrity-and-narrative-memory]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source snapshot
        run: |
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/commit.txt
          git archive --format=tar.gz HEAD > test-artifacts/source.tar.gz
          python3 --version | tee test-artifacts/python-version.txt
      - name: Run every standalone regression suite
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for suite in novel-orchestrator/tools/tests/test_*.py; do
            name="$(basename "$suite" .py)"
            echo "::group::$name"
            if ! python3 "$suite" 2>&1 | tee "test-artifacts/$name.log"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-test-evidence
          path: test-artifacts/
          retention-days: 14
