name: Apply verified novel upgrade

on:
  push:
    branches: [feat/novel-integrity-and-narrative-memory]
    paths:
      - '.github/novel-transfer/**'
      - '.github/workflows/apply-novel-upgrade.yml'

permissions:
  contents: write

concurrency:
  group: apply-verified-novel-upgrade
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'jyqj/novelai-test' && github.ref == 'refs/heads/feat/novel-integrity-and-narrative-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and reconstruct reviewed source edits
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path.cwd().resolve()
          encoded = ''.join((root / f'.github/novel-transfer/part-{i}.txt').read_text(encoding='ascii') for i in range(4))
          package = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128 * 1024 * 1024)
          expected = 'f17409115567f2d4921effbd8b01f406791966cff9b6af2abd49f1d623241679'
          if hashlib.sha256(package).hexdigest() != expected:
              raise SystemExit('Transfer package hash mismatch')
          changes = json.loads(package)
          if len(changes) != 68:
              raise SystemExit('Unexpected change count')
          prepared = {}
          for name, change in changes.items():
              rel = Path(name)
              if rel.is_absolute() or '..' in rel.parts or not name.startswith('novel-orchestrator/'):
                  raise SystemExit(f'Unexpected destination: {name}')
              path = root / rel
              if path.is_symlink() or not path.resolve().is_relative_to(root / 'novel-orchestrator'):
                  raise SystemExit(f'Unsafe destination: {name}')
              old = path.read_bytes() if path.exists() else None
              before = hashlib.sha256(old).hexdigest() if old is not None else None
              if before != change['before']:
                  raise SystemExit(f'Base content mismatch: {name}')
              lines = (old or b'').decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  if not (0 <= start <= end <= len(lines)):
                      raise SystemExit(f'Invalid edit range: {name}')
                  lines[start:end] = [replacement]
              new = ''.join(lines).encode('utf-8')
              if hashlib.sha256(new).hexdigest() != change['after']:
                  raise SystemExit(f'Reconstructed content mismatch: {name}')
              prepared[name] = new
          for name, new in prepared.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          Path(os.environ['RUNNER_TEMP'], 'novel-changed-paths.json').write_text(json.dumps(list(prepared)), encoding='utf-8')
          print(f'Verified all before/after SHA256 hashes; reconstructed {len(prepared)} source files.')
          PY
      - name: Run full regression before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q novel-orchestrator/tools
          git diff --check
          for suite in novel-orchestrator/tools/tests/test_*.py; do
            echo "::group::$(basename "$suite")"
            python3 "$suite"
            echo "::endgroup::"
          done
      - name: Commit only verified source paths to the feature branch
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads(Path(os.environ['RUNNER_TEMP'], 'novel-changed-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if set(filter(None, staged)) != set(paths):
              raise SystemExit('Staged path set does not match verified source edits')
          subprocess.run(['git', '-c', 'user.name=Novel maintenance bot', '-c', 'user.email=novel-maintenance@users.noreply.github.com', 'commit', '-m', 'feat: enforce novel integrity, evidence-bound reviews and historical narrative memory'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/novel-integrity-and-narrative-memory'], check=True)
          PY
